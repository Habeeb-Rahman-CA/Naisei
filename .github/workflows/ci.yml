name: Naisei CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-and-build:
    name: Install, Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: naisei_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Check Code Formatting
        run: npm run format:check

      - name: Lint Codebase
        run: npm run lint

      - name: Build Shared Types
        run: npm run build:types

      - name: Run Backend Unit & Integration Tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres_ci_password
          DB_DATABASE: naisei_dev
          JWT_ACCESS_SECRET: ci_test_access_secret_key_123456
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_654321
        run: npm run test:api

      - name: Build Backend API
        run: npm run build:api

      - name: Build Frontend Web PWA
        run: npm run build:web
